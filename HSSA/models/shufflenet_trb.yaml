# Parameters
nc: 8  # number of classes
depth_multiple: 0.33  # model depth multiple
width_multiple: 0.50  # layer channel multiple
anchors:
  # - [9,12, 17,15, 25,28]  # P3/8
  # - [42,42, 91,56, 68,94]  # P4/16
  # - [177,101, 140,245, 555,343]  # P5/32

  # - [ 5,6, 8,9, 15,17]  # P3/8
  # - [26,28, 50,26, 40,52]  # P4/16
  # - [82,52, 76,112, 178,109]  # P5/32

  - [5,12, 16,45, 65,40]  # P3/8
  - [50,110, 72,168, 101,198]  # P4/16
  #- [116,90, 156,198, 373,326]  # P5/32

# YOLOv5 v6.0 backbone
backbone:
  # [from, number, module, args]
  # Shuffle_Block: [out, stride]

  [[ -1, 1, CBRM, [ 384 ] ], # 0-P2/4
   [ -1, 1, Shuffle_Block, [ 512, 2 ] ],  # 1-P3/8
   [ -1, 3, Shuffle_Block, [ 512, 1 ] ],  # 2
   [ -1, 1, Shuffle_Block, [ 1024, 2 ] ],  # 3-P4/16
   [ -1, 7, Shuffle_Block, [ 1024, 1 ] ],  # 4
  ]



# YOLOv5 v6.0 head
head:
  [[-1, 1, DWConv, [512, 1, 1]],  # 20*20*512   #head3
   #[-1, 1, nn.Upsample, [None, 2, 'nearest']],  #40*40*512
   [[-1, 4], 1, Concat, [1]],  # cat backbone P4  40*40*1024
   [-1, 3, C3Ghost, [512, False]],  # 13   40*40*512  

   [-1, 1, DWConv, [256, 1, 1]],  #40*40*256   head2
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],  #80*80*256
   [[-1, 2], 1, Concat, [1]],  # cat backbone P3  #80*80*512
   [-1, 3, C3Ghost, [256]],  # 17 (P3/8-small)  #80*80*256

   [-1, 1, DWConv, [256, 3, 2]], #40*40*256
   [[-1, 8], 1, Concat, [1]],  # cat head P4  40*40*512 
   [-1, 3, C3Ghost, [512]],  # 20 (P4/16-medium) 40*40*512  

   [[11, 14], 1, Detect, [nc, anchors]],  # Detect(P3, P4, P5)  #检测头的C3模块占glops的0.25左右
  ]
railseg:

  [
   [ 11, 1, C3Ghost, [256]],                                     #25  输入80*80*256  输出80*80*128  3*3卷积核
   [ -1, 1, nn.Upsample, [None, 4, 'nearest']],
   [ -1, 1, DWConv, [64, 3, 1]],                                       #27  160*160*64
   [ -1, 1, nn.Upsample, [None, 2, 'nearest']],
   [ -1, 1, DWConv, [8, 3, 1,]],                                       #31  320*320*8
   [ -1, 1, DWConv, [3, 3, 1]],                                       #34  640*640*3
  ]



